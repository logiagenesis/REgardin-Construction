# Quality gate on every push to main, against the cPanel build.
name: Audit gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build (cPanel target)
        run: npm run build:cpanel

      - name: Lint and format
        run: npm run lint

      - name: HTML validation
        run: npm run validate:html

      - name: Link check
        run: npm run check:links

      - name: Banned-content check
        run: npm run check:banned

      - name: .htaccess on Apache
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apache2
          sudo a2enmod rewrite headers deflate mime >/dev/null
          printf 'Listen 8088\n<VirtualHost *:8088>\n  DocumentRoot %s/dist\n  <Directory %s/dist>\n    AllowOverride All\n    Require all granted\n  </Directory>\n</VirtualHost>\n' "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE" | sudo tee /etc/apache2/sites-available/site.conf >/dev/null
          sudo a2ensite site >/dev/null
          chmod o+x "$HOME" "$HOME/work" "$HOME/work/${{ github.event.repository.name }}" "$GITHUB_WORKSPACE"
          sudo systemctl restart apache2
          npm run qa:apache

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright + axe
        run: npm run test:e2e

      - name: Lighthouse CI (mobile)
        run: npm run lighthouse

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: audit-reports
          path: |
            playwright-report/
            test-results/
            lighthouse-reports/
          retention-days: 14
