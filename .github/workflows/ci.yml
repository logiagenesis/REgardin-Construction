name: Audit gate

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build (preview)
        run: npm run build

      - name: Production build gate (fails on any [CONFIRM] left in dist/)
        # Expected to fail until every placeholder is resolved; informational before launch.
        continue-on-error: true
        run: npm run build:production

      - name: Rebuild preview for the remaining checks
        run: npm run build

      - name: Lint and format
        run: npm run lint

      - name: HTML validation
        run: npm run validate:html

      - name: Link check
        run: npm run check:links

      - name: Banned-content grep
        run: npm run check:banned

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright + axe
        run: npm run test:e2e

      - name: Lighthouse CI (mobile)
        run: npm run lighthouse

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: audit-reports
          path: |
            playwright-report/
            test-results/
            lighthouse-reports/
          retention-days: 14
